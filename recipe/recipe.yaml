# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: 0.6.5

package:
  name: markdown-to-confluence
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/markdown-to-confluence/markdown_to_confluence-${{ version }}.tar.gz
  sha256: 853b1ee42812edcf4b3f4f2a8f7b1d900edc09809659b8ec83030e708db50f77

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - md2conf = md2conf.__main__:main

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=80.0
    - pip
  run:
    - python >=${{ python_min }},<4
    - cattrs >=26.2
    - lxml >=6.1
    - markdown >=3.10
    - orjson >=3.13
    - pymdown-extensions >=12.2
    - pyyaml >=6.0
    - requests >=2.34
    - truststore >=0.10
    - typing_extensions >=4.16
    - pathspec >=1.1
  run_constraints:
    - matplotlib >=3.10

tests:
  - python:
      imports:
        - md2conf
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - '*'
  - requirements:
      run:
        - python ${{ python_min }}.*
    script:
      - md2conf --help

about:
  summary: Publish Markdown files to Confluence wiki
  homepage: https://github.com/hunyadi/md2conf
  repository: https://github.com/hunyadi/md2conf
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - rxm7706
